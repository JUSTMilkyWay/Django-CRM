{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">

</head>
<body>
    <aside>
        <img src="{% static 'main/img/RingedPlanet_Pixelited.png' %}" alt="Лого">
        <span class="logo" >CRM</span>
        <h3>Навигация</h3>
        <ul>
            <a href="{% url 'home_page' %}"><li><i class="bi bi-house-door"></i>Главная</li></a>
            <a href="{% url 'crm_page' %}"><li><i class="bi bi-funnel"></i>CRM</li></a>
            <a href="{% url 'tools_main' %}"><li><i class="bi bi-pencil-square"></i>Инструменты</li></a>
        </ul>
        <ul class="options_layout">
            <a href=""><li ><i class="bi bi-gear-wide"></i><span style="text-decoration: line-through;">Настройки</span></li></a><br>
            <a href="{% url 'profile' %}"><li><i class="bi bi-person-square"></i> Аккаунт</li></a>
        </ul>
        <style>
          a {
          text-decoration: none;
          }
        </style>
    </aside>
    <main>
        {% block content %}

        {% endblock %}
    </main>
</body>
</html>
