{% extends "main/layout.html" %}

{% block title %}TXT → Excel{% endblock %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>TXT → Excel</h2>
        <a href="{% url 'tools_main' %}" class="btn btn-outline-secondary">
            ← Назад
        </a>
    </div>

    <div class="card shadow border-0">
        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Выберите TXT файлы
                    </label>
                    <input type="file"
                           name="txt_files"
                           multiple
                           accept=".txt"
                           class="form-control">
                </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-arrow-repeat"></i>
                    Конвертировать
                </button>

            </form>

        </div>
    </div>

</div>

{% endblock %}
