{% extends 'main/layout.html' %}
{% load static %}

{% block title %}Настройки CRM{% endblock %}
{% block content %}

<link rel="stylesheet" href="{% static 'crm/css/settings.css' %}">

{% include 'crm/crm_header.html' with active_tab='settings' %}

<div class="crm-settings">
    <div class="settings-block">
        <h2>Колонки канбан-доски</h2>

        <div class="columns-list" id="columnsList">
            {% for column in columns %}
            <div class="column-item" data-column-id="{{ column.id }}">
                <div class="column-main">
                    <input type="text"
                           class="column-title"
                           value="{{ column.title }}"
                           data-original="{{ column.title }}"
                           maxlength="50">
                    <button class="btn-delete"
                            type="button"
                            onclick="deleteColumn({{ column.id }})">
                        Удалить
                    </button>
                </div>

                <div class="column-options">
                    <label>
                        <input type="checkbox" class="final-stage">
                        Финальная стадия
                    </label>
                    <label>
                        <input type="checkbox" class="exclude-stage">
                        Исключить из аналитики
                    </label>
                </div>

                <div class="column-meta">
                    Карточек: {{ column.leads.count }}
                </div>
            </div>
            {% endfor %}
        </div>

        <button class="btn-add" type="button" onclick="addNewColumn()">
            + Добавить колонку
        </button>
    </div>

    <div class="actions-block">
        <button class="btn-secondary" type="button" onclick="resetToDefault()">
            Сбросить
        </button>
        <button class="btn btn-primary btn-save" type="button" onclick="saveAllChanges()">
            Сохранить
        </button>
    </div>
</div>

<script src="{% static 'crm/js/settings.js' %}"></script>

{% endblock %}
