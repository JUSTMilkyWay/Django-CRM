{% extends 'main/layout.html' %}
{% load static %}

{% block title %}Настройки CRM{% endblock %}
{% block content %}

<link rel="stylesheet" href="{% static 'crm/css/settings.css' %}">

<script defer src="{% static 'crm/js/settings.js' %}"></script>

{% include 'crm/crm_header.html' with active_tab='settings' %}

<div class="crm-settings">
    <div class="settings-block">
        <h2>Колонки канбан-доски</h2>

        <div class="columns-list" id="columnsList">
            {% for column in columns %}
            <div class="column-item" data-column-id="{{ column.id }}">

                <div class="column-main">
                    <input type="text"
                           class="column-title"
                           value="{{ column.title }}"
                           data-original="{{ column.title }}"
                           maxlength="50">

                    <button class="btn-delete"
                            onclick="deleteColumn({{ column.id }})">
                        Удалить
                    </button>
                </div>

                <div class="column-options">
                    <label>
                        <input type="checkbox"
                               class="final-stage"
                               {% if column.is_final %}checked{% endif %}>
                        Финальная стадия
                    </label>

                    <label>
                        <input type="checkbox"
                               class="exclude-stage"
                               {% if column.exclude_from_stats %}checked{% endif %}>
                        Исключить из аналитики
                    </label>
                </div>

                <div class="column-meta">
                    Карточек: {{ column.leads.count }}
                </div>

            </div>
            {% endfor %}
        </div>

        <button class="btn-add" onclick="addNewColumn()">
            + Добавить колонку
        </button>
    </div>

    <div class="actions-block">
        <button class="btn-secondary" onclick="resetToDefault()">
            Сбросить
        </button>

        <button type="submit" class="btn btn-primary btn-save">Сохранить</button>
    </div>

</div>

{% endblock %}
