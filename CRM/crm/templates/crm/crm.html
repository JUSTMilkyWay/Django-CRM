{% extends 'main/layout.html' %}
{% block title %}CRM{% endblock %}

{% block content %}
<div class="crm crm-page">

    <div class="crm-header">
        <button class="crm-btn active">Лиды</button>
        <button class="crm-btn">ToDo</button>
    </div>
    <div class="kanban">
        {% for column in columns %}
        <div class="kanban-column" ondragover="allowDrop(event)" ondrop="drop(event, {{ column.id }})">
            <h2>{{ column.title }}</h2>
            <button class="add-card-btn" onclick="addCard(this, {{ column.id }})">+</button>
            <div class="kanban-cards">
                {% for lead in column.leads.all %}
                <div class="kanban-card" data-id="{{ lead.id }}" draggable="true" ondragstart="drag(event)">
                    <span contenteditable="true">{{ lead.company_name }}</span>
                    <button class="delete-btn" onclick="deleteCard({{ lead.id }})">&times;</button>
                </div>
            {% endfor %}

            </div>
        </div>
        {% endfor %}
    </div>

</div>

<script>
function addCard(button, columnId) {
    fetch(`/add_lead/${columnId}/`, { method: 'POST' })
    .then(res => res.json())
    .then(data => {
        const container = button.nextElementSibling;
        const div = document.createElement('div');
        div.className = 'kanban-card';
        div.dataset.id = data.id;
        div.draggable = true;
        div.ondragstart = drag;
        div.innerHTML = `<span contenteditable="true">${data.company_name}</span>
                         <button class="delete-btn" onclick="deleteCard(${data.id})">&times;</button>`;
        container.appendChild(div);
    });
}

function deleteCard(leadId) {
    fetch(`/delete_lead/${leadId}/`, { method: 'POST' })
    .then(() => {
        const el = document.querySelector(`.kanban-card[data-id='${leadId}']`);
        el.remove();
    });
}

// Drag & drop
let dragged;

function drag(event) {
    dragged = event.target;
    event.dataTransfer.setData("text/plain", "");
    dragged.classList.add('dragging');
}

function allowDrop(event) {
    event.preventDefault();
}

function drop(event, columnId) {
    event.preventDefault();
    const container = event.currentTarget;
    container.appendChild(dragged);

    // Отправляем на сервер новый порядок и колонку
    fetch(`/move_lead/${dragged.dataset.id}/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            column_id: columnId
        })
    });
}

document.addEventListener("dragend", e => e.target.classList.remove('dragging'));
</script>

{% endblock %}
